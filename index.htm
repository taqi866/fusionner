<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تصنيع: وثائق A4 (PDF & JPG)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background-color: #f1f5f9;
        }

        .custom-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        #finalCanvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-200">
                    <i class="fas fa-print text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-slate-900">نظام <span class="text-blue-600">التجميع الذكي</span></h1>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">A4 PDF & JPG Multipage System</p>
                </div>
            </div>
            <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-blue-100 transition-all active:scale-95">
                <i class="fas fa-cloud-upload-alt ml-2"></i>إضافة صور للمشروع
            </button>
            <input type="file" id="fileInput" class="hidden" multiple accept="image/*">
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white rounded-3xl p-6 border border-slate-200 custom-shadow">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="font-bold text-lg text-slate-700 flex items-center gap-2">
                            <i class="fas fa-list-ul text-blue-500"></i>
                            قائمة الصور المختارة
                        </h2>
                        <button onclick="clearItems()" class="text-red-500 hover:text-red-700 text-xs font-bold transition-colors">مسح القائمة</button>
                    </div>

                    <div id="sidebarList" class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                        <div id="emptyState" class="py-12 text-center text-slate-400 border-2 border-dashed border-slate-100 rounded-2xl">
                            <i class="fas fa-images text-4xl mb-3 opacity-20"></i>
                            <p class="text-xs">لم يتم اختيار أي صور بعد</p>
                        </div>
                    </div>

                    <div id="actionContainer" class="hidden mt-6 pt-6 border-t border-slate-100">
                        <button onclick="processAndGenerate()" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-3 shadow-xl">
                            <i class="fas fa-magic"></i>توليد ومعاينة الوثيقة
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="bg-white rounded-3xl p-6 border border-slate-200 custom-shadow min-h-[70vh] flex flex-col relative">
                    <div class="flex flex-col sm:flex-row items-center justify-between mb-6 gap-4 border-b border-slate-50 pb-4">
                        <h2 class="font-bold text-lg flex items-center gap-2">
                            <i class="fas fa-file-pdf text-red-500"></i>معاينة الطباعة (A4)
                        </h2>
                        
                        <div id="exportBtns" class="hidden flex items-center gap-2">
                            <button onclick="downloadAsJPG()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 transition-all">
                                <i class="fas fa-image"></i>حفظ كصورة JPG
                            </button>
                            <button onclick="downloadAsPDF()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg shadow-red-100 transition-all">
                                <i class="fas fa-file-pdf"></i>تحميل PDF
                            </button>
                        </div>
                    </div>

                    <div id="canvasBox" class="flex-grow flex items-start justify-center bg-slate-50 rounded-2xl p-6 relative overflow-auto">
                        <p id="placeholderText" class="text-slate-300 text-sm italic mt-20 text-center">سيتم تجميع كل 4 صور في صفحة A4 واحدة تلقائياً</p>
                        <canvas id="finalCanvas" class="hidden custom-shadow"></canvas>
                        
                        <div id="loadingUI" class="hidden absolute inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center rounded-2xl z-20">
                            <div class="loader mb-4"></div>
                            <p class="font-bold text-slate-600">جاري تنظيم الصفحات ومعالجة الصور...</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-8 py-4 rounded-2xl shadow-2xl opacity-0 transform translate-y-10 transition-all z-50 pointer-events-none"></div>

    <script>
        const { jsPDF } = window.jspdf;
        let jobList = [];
        
        const A4_WIDTH = 2480; 
        const A4_HEIGHT = 3508;
        const PADDING = 80;
        const CELL_W = (A4_WIDTH - (PADDING * 3)) / 2;
        const CELL_H = (A4_HEIGHT - (PADDING * 3)) / 2;
        const INFO_H = 250;

        const fileInput = document.getElementById('fileInput');
        const sidebarList = document.getElementById('sidebarList');
        const emptyState = document.getElementById('emptyState');
        const actionContainer = document.getElementById('actionContainer');
        const canvas = document.getElementById('finalCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const exportBtns = document.getElementById('exportBtns');
        const loadingUI = document.getElementById('loadingUI');
        const placeholderText = document.getElementById('placeholderText');

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            let processed = 0;
            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    jobList.push({
                        id: Date.now() + Math.random(),
                        name: file.name,
                        data: event.target.result,
                        qty: 1,
                        size: ""
                    });
                    processed++;
                    if(processed === files.length) renderSidebar();
                };
                reader.readAsDataURL(file);
            });
            fileInput.value = '';
        });

        function renderSidebar() {
            if (jobList.length > 0) {
                emptyState.classList.add('hidden');
                actionContainer.classList.remove('hidden');
            } else {
                emptyState.classList.remove('hidden');
                actionContainer.classList.add('hidden');
            }

            sidebarList.innerHTML = jobList.map(item => `
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col gap-3 group transition-all hover:border-blue-200">
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <img src="${item.data}" class="w-16 h-16 object-cover rounded-xl border border-slate-100 shadow-sm">
                            <button onclick="removeJob(${item.id})" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="flex-grow min-w-0">
                            <p class="text-[11px] font-bold text-slate-500 truncate">${item.name}</p>
                            <p class="text-[10px] text-blue-500 font-bold">صورة رقم ${jobList.indexOf(item) + 1}</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 block mb-1">الكمية</label>
                            <input type="number" value="${item.qty}" min="1" onchange="updateJob(${item.id}, 'qty', this.value)" class="w-full bg-slate-50 border border-slate-100 rounded-xl px-3 py-2 text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-all">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 block mb-1">القياس (سم)</label>
                            <input type="text" placeholder="50x70" value="${item.size}" onchange="updateJob(${item.id}, 'size', this.value)" class="w-full bg-slate-50 border border-slate-100 rounded-xl px-3 py-2 text-sm font-bold outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-all">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateJob(id, key, val) {
            const item = jobList.find(i => i.id === id);
            if (item) item[key] = val;
        }

        function removeJob(id) {
            jobList = jobList.filter(i => i.id !== id);
            renderSidebar();
            resetView();
        }

        function clearItems() {
            if(confirm("هل أنت متأكد من مسح جميع الصور؟")) {
                jobList = [];
                renderSidebar();
                resetView();
            }
        }

        function resetView() {
            canvas.classList.add('hidden');
            placeholderText.classList.remove('hidden');
            exportBtns.classList.add('hidden');
        }

        async function processAndGenerate() {
            if (jobList.length === 0) return;
            loadingUI.classList.remove('hidden');
            
            const pagesCount = Math.ceil(jobList.length / 4);
            canvas.width = A4_WIDTH;
            canvas.height = A4_HEIGHT * pagesCount;

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            try {
                for (let i = 0; i < jobList.length; i++) {
                    const item = jobList[i];
                    const pageIndex = Math.floor(i / 4);
                    const itemIndexInPage = i % 4;
                    const col = itemIndexInPage % 2;
                    const row = Math.floor(itemIndexInPage / 2);
                    const startX = PADDING + (col * (CELL_W + PADDING));
                    const startY = (pageIndex * A4_HEIGHT) + PADDING + (row * (CELL_H + PADDING));
                    await drawItem(item, startX, startY);
                }

                loadingUI.classList.add('hidden');
                canvas.classList.remove('hidden');
                placeholderText.classList.add('hidden');
                exportBtns.classList.remove('hidden');
                showToast("تم توليد المعاينة بنجاح");
            } catch (error) {
                console.error(error);
                loadingUI.classList.add('hidden');
                showToast("خطأ في معالجة الصور");
            }
        }

        async function drawItem(item, x, y) {
            const img = await loadImage(item.data);
            ctx.fillStyle = "#f8fafc";
            ctx.beginPath();
            ctx.roundRect(x, y, CELL_W, INFO_H, 40);
            ctx.fill();

            ctx.textBaseline = "middle";
            ctx.textAlign = "right";
            ctx.fillStyle = "#64748b";
            ctx.font = "bold 45px 'Noto Sans Arabic'";
            ctx.fillText("الكمية:", x + CELL_W - 60, y + INFO_H/2 - 40);
            ctx.fillStyle = "#0f172a";
            ctx.font = "900 110px 'Noto Sans Arabic'";
            ctx.fillText(item.qty, x + CELL_W - 60, y + INFO_H/2 + 40);

            ctx.textAlign = "left";
            ctx.fillStyle = "#64748b";
            ctx.font = "bold 45px 'Noto Sans Arabic'";
            ctx.fillText("القياس:", x + 60, y + INFO_H/2 - 40);
            ctx.fillStyle = "#2563eb";
            ctx.font = "900 80px 'Noto Sans Arabic'";
            const sizeDisplay = item.size.replace(/x/g, ' × ') || "---";
            ctx.fillText(sizeDisplay, x + 60, y + INFO_H/2 + 40);

            const imgAreaY = y + INFO_H + 40;
            const imgAreaH = CELL_H - INFO_H - 40;
            ctx.strokeStyle = "#f1f5f9";
            ctx.lineWidth = 2;
            ctx.strokeRect(x, imgAreaY, CELL_W, imgAreaH);

            const ratio = Math.min(CELL_W / img.width, imgAreaH / img.height);
            const nw = img.width * ratio;
            const nh = img.height * ratio;
            const nx = x + (CELL_W - nw) / 2;
            const ny = imgAreaY + (imgAreaH - nh) / 2;
            ctx.drawImage(img, nx, ny, nw, nh);
        }

        function loadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = src;
            });
        }

        function downloadAsPDF() {
            const pagesCount = Math.ceil(jobList.length / 4);
            const pdf = new jsPDF({
                orientation: 'p',
                unit: 'px',
                format: [A4_WIDTH, A4_HEIGHT]
            });

            for (let i = 0; i < pagesCount; i++) {
                if (i > 0) pdf.addPage([A4_WIDTH, A4_HEIGHT], 'p');
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = A4_WIDTH;
                tempCanvas.height = A4_HEIGHT;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(canvas, 0, i * A4_HEIGHT, A4_WIDTH, A4_HEIGHT, 0, 0, A4_WIDTH, A4_HEIGHT);
                const pageData = tempCanvas.toDataURL('image/jpeg', 0.95);
                pdf.addImage(pageData, 'JPEG', 0, 0, A4_WIDTH, A4_HEIGHT);
            }
            pdf.save(`طلب_إنتاج_${Date.now()}.pdf`);
        }

        function downloadAsJPG() {
            const link = document.createElement('a');
            link.download = `وثيقة_إنتاج_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
            showToast("جاري تحميل الصورة...");
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.opacity = "1";
            t.style.transform = "translate(50%, 0)";
            setTimeout(() => {
                t.style.opacity = "0";
                t.style.transform = "translate(50%, 20px)";
            }, 3000);
        }
    </script>
</body>
</html>
